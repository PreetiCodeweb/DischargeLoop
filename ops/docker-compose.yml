services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dischargeloop}
      POSTGRES_USER: ${POSTGRES_USER:-dischargeloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-dischargeloop_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:-dischargeloop_migrator}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init/001-roles.sh:/docker-entrypoint-initdb.d/001-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dischargeloop} -d ${POSTGRES_DB:-dischargeloop}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  api:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -c "npm ci && npm run start:dev"
    environment:
      API_PORT: 3000
      DATABASE_URL: postgresql://${APP_DB_USER:-dischargeloop_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-dischargeloop}?options=-csearch_path%3Ddischargeloop
      MIGRATION_DATABASE_URL: postgresql://${MIGRATION_DB_USER:-dischargeloop_migrator}:${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-dischargeloop}?options=-csearch_path%3Ddischargeloop
      REDIS_URL: redis://redis:6379
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:8080/realms/dischargeloop}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/dischargeloop/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-dischargeloop-api}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-5173}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ../apps/api:/workspace
      - ../db/migrations:/db/migrations:ro
      - worker_node_modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  reservation-expirer:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -c "npm ci && npm run migrate && npm run build && npm run expire:reservations"
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER:-dischargeloop_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-dischargeloop}?options=-csearch_path%3Ddischargeloop
      MIGRATION_DATABASE_URL: postgresql://${MIGRATION_DB_USER:-dischargeloop_migrator}:${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-dischargeloop}?options=-csearch_path%3Ddischargeloop
    volumes:
      - ../apps/api:/workspace
      - ../db/migrations:/db/migrations:ro
      - api_node_modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:24-alpine
    working_dir: /workspace
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-3000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ../apps/web:/workspace
      - web_node_modules:/workspace/node_modules

volumes:
  postgres_data:
  api_node_modules:
  worker_node_modules:
  web_node_modules:
